[package]
name = "ci-with-wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
cap-directories = "4"
cap-std = "4"
extism = { version = "1.41", default-features = false }
oci-unpack = "0.1.1"
libcontainer = "0.7.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.29", features = ["fs", "process", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing = "0.1"
gix = { version = "0.88", default-features = false, features = ["blocking-http-transport-reqwest-rust-tls", "worktree-mutation", "sha1"] }
hmac = "0.12"
sha2 = "0.10"
tiny_http = "0.12"
xattr = "1.6"

